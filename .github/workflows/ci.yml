name: Java Application CI

on:
  push:
    branches:
      - main
      - "feature/**"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: java-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Build, unit and integration tests
    runs-on: windows-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Show toolchain
        shell: pwsh
        run: |
          java -version
          mvn -version
          git --version

      - name: Build and verify
        shell: pwsh
        run: mvn -B -ntp clean verify

      - name: Generate Surefire HTML report
        if: always()
        shell: pwsh
        run: |
          if (Test-Path 'target/surefire-reports') {
            mvn -B -ntp surefire-report:report-only
          }

      - name: Generate JaCoCo HTML report
        if: always()
        shell: pwsh
        run: |
          if (Test-Path 'target/jacoco.exec') {
            mvn -B -ntp jacoco:report
          }

      - name: Upload unit test and coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-windows
          path: |
            target/surefire-reports/**
            target/site/surefire-report.html
            target/site/jacoco/**
          if-no-files-found: warn
          retention-days: 7

      - name: Upload Failsafe integration test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: failsafe-reports-windows
          path: target/failsafe-reports/**
          if-no-files-found: warn
          retention-days: 7

      - name: Upload executable JAR
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: task-manager-jar
          path: target/task-manager-cicd-1.0.0.jar
          if-no-files-found: error
          retention-days: 7